# Serves the built SPA and reverse-proxies API calls to the `api` container. See root Dockerfile
# (builds the SPA into /usr/share/nginx/html) and docker-compose.prod.yml (wires the `api` upstream).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # API — proxied 1:1 (both sides end in /api/), so /api/auth/login -> http://api:4000/api/auth/login.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 10m;
    }

    # API liveness/DB check (server/src/app.ts) — not under /api, proxied separately for convenience.
    location = /healthz {
        proxy_pass http://api:4000/healthz;
    }

    # SPA: real static files (JS/CSS/icons/manifest/sw.js) are served as-is; any other path falls back
    # to index.html so client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker must never be cached long-term or new deploys won't be picked up.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
