<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Offline · EduNova</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(40rem 24rem at 80% 10%, rgba(99,102,241,.35), transparent 60%),
        radial-gradient(34rem 22rem at 95% 60%, rgba(56,189,248,.28), transparent 60%),
        radial-gradient(28rem 18rem at 20% 90%, rgba(244,114,182,.22), transparent 60%),
        #090911;
      color: #f2f2f7; text-align: center; padding: 2rem;
    }
    .card {
      max-width: 26rem; padding: 3rem 2.5rem; border-radius: 2rem;
      background: rgba(18,18,28,.85); border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(20px);
    }
    .flower { width: 64px; height: 64px; margin: 0 auto 1.5rem; animation: float 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 2rem; letter-spacing: -.02em; }
    p { margin-top: .9rem; color: rgba(255,255,255,.55); font-size: .95rem; line-height: 1.6; }
    .status { margin-top: 1.25rem; display: inline-flex; align-items: center; gap: .5rem; font-size: .8rem;
      color: #fbbf24; background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.25);
      padding: .4rem .9rem; border-radius: 999px; }
    .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #fbbf24; animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .3 } }
    button {
      margin-top: 1.75rem; border: 0; cursor: pointer; font: 600 .95rem 'Inter', sans-serif;
      padding: .9rem 2.2rem; border-radius: 999px; background: #f2f2f7; color: #0b0b10;
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -10px rgba(255,255,255,.3); }
  </style>
</head>
<body>
  <div class="card">
    <svg class="flower" viewBox="0 0 40 40" fill="none">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="40" y2="40">
          <stop offset="0" stop-color="#6366f1"/><stop offset=".55" stop-color="#0ea5e9"/><stop offset="1" stop-color="#ec4899"/>
        </linearGradient>
      </defs>
      <ellipse cx="20" cy="12.5" rx="5.2" ry="9.5" fill="url(#g)"/>
      <ellipse cx="20" cy="12.5" rx="5.2" ry="9.5" fill="url(#g)" transform="rotate(60 20 20)"/>
      <ellipse cx="20" cy="12.5" rx="5.2" ry="9.5" fill="url(#g)" transform="rotate(120 20 20)"/>
      <ellipse cx="20" cy="12.5" rx="5.2" ry="9.5" fill="url(#g)" transform="rotate(180 20 20)"/>
      <ellipse cx="20" cy="12.5" rx="5.2" ry="9.5" fill="url(#g)" transform="rotate(240 20 20)"/>
      <ellipse cx="20" cy="12.5" rx="5.2" ry="9.5" fill="url(#g)" transform="rotate(300 20 20)"/>
      <circle cx="20" cy="20" r="4.2" fill="#f2f2f7"/>
    </svg>
    <h1>You’re offline</h1>
    <p>EduNova couldn’t reach the internet. Pages you’ve already visited are still available from cache — this one needs a connection.</p>
    <span class="status"><span class="dot"></span> Waiting for connection…</span>
    <br />
    <button id="retry">Try again</button>
  </div>
  <script>
    const go = () => { if (navigator.onLine) location.href = '/' }
    document.getElementById('retry').addEventListener('click', () => location.reload())
    window.addEventListener('online', go)
  </script>
</body>
</html>
